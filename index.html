<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>2048 Multiplayer — Legal</title>
    <style>
      :root { color-scheme: light dark; --ink: #241059; --muted: #5f5480; --accent: #6d4dff; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: linear-gradient(160deg, #f7f4ff 0%, #ece5ff 100%);
        color: var(--ink);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        line-height: 1.6;
      }
      main {
        width: min(560px, 100%);
        background: #fff;
        border: 1px solid #e4dcff;
        border-radius: 20px;
        padding: 36px;
        box-shadow: 0 20px 60px rgba(36, 16, 89, 0.08);
      }
      h1 { margin: 0 0 6px; font-size: 30px; }
      p { color: var(--muted); }
      a { color: var(--accent); }
      ul { padding-left: 20px; }
      @media (prefers-color-scheme: dark) {
        body { background: radial-gradient(circle at top, #2b1a6e 0%, #12082f 60%); color: #f4efff; }
        main { background: #1c1043; border-color: #332066; }
        p { color: #c9bdf0; }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>2048 Multiplayer</h1>
      <p>Legal and support pages for the game.</p>
      <ul>
        <li><a href="./privacy.html">Privacy Policy</a></li>
        <li><a href="mailto:scalera.support@gmail.com">Support: scalera.support@gmail.com</a></li>
      </ul>
      <p>Operated by Scalera Technologies.</p>
    </main>
  </body>
</html>
